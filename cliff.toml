# Changelog generated from Conventional Commits: `npx git-cliff@2.6.1 -o CHANGELOG.md`
[changelog]
header = """
# Changelog

Generated from the commit history by [git-cliff](https://git-cliff.org). Versions follow
[Semantic Versioning](https://semver.org). 0.1.0 was the interactive prototype in Claude Design;
0.2.0 is the first native build.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^style", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = '^chore\(release\)', skip = true },
  { message = "^(chore|build|ci)", group = "<!-- 5 -->Maintenance" },
  { message = "^test", group = "<!-- 6 -->Tests" },
]
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
